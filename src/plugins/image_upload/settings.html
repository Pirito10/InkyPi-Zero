<style>
    .photo-picker-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .photo-picker-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 10px;
        margin-top: 10px;
    }

    .photo-picker-item {
        position: relative;
        border-radius: 8px;
        overflow: hidden;
        aspect-ratio: 1 / 1;
        cursor: pointer;
        border: 2px solid transparent;
        background: var(--bg-secondary, #f5f5f5);
    }

    .photo-picker-item.selected {
        border-color: #007bff;
    }

    .photo-picker-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .photo-picker-item input[type="checkbox"] {
        position: absolute;
        top: 6px;
        left: 6px;
        width: 20px;
        height: 20px;
    }

    .photo-picker-empty {
        color: var(--text-secondary, #666);
        font-size: 0.9rem;
        margin-top: 10px;
    }
</style>

<div class="form-group">
    <div class="form-group">
        <label for="padImage" class="form-label">Scale to Fit:</label>
        <div class="toggle-container">
            <input type="checkbox" id="padImage" name="padImage" class="toggle-checkbox" value="false">
            <label for="padImage" class="toggle-label"></label>
        </div>
        <!-- Hidden input ensures 'true' is always sent when unchecked -->
        <input type="hidden" name="padImage" value="true">
    </div>
    <div class="form-group">
        <label for="randomize" class="form-label">Random Order:</label>
        <div class="toggle-container">
            <input type="checkbox" id="randomize" name="randomize" class="toggle-checkbox" value="false"
                onclick="this.value = this.checked ? 'true' : 'false'">
            <label for="randomize" class="toggle-label"></label>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label" for="backgroundOption">Background:</label>
        <div class="form-group">
            <input type="radio" id="backgroundOption" name="backgroundOption" value="blur">
            <label>Blur</label>
            <input type="radio" id="backgroundOption" name="backgroundOption" value="color">
            <label>Color</label>
            <input type="color" id="backgroundColor" name="backgroundColor" value="#ffffff" class="color-picker"/>
        </div>
    </div>
</div>

<div class="form-group">
    <div class="photo-picker-header">
        <label class="form-label">Fotos que rotan:</label>
        <a href="/photo-library" target="_blank" class="action-button compact">Gestionar biblioteca</a>
    </div>
    <div id="photoPickerGrid" class="photo-picker-grid"></div>
    <div id="photoPickerEmpty" class="photo-picker-empty" style="display: none;">
        No hay fotos en la biblioteca todavía. Súbelas desde "Gestionar biblioteca".
    </div>
</div>

<script>
    async function loadPhotoPicker() {
        const grid = document.getElementById('photoPickerGrid');
        const emptyState = document.getElementById('photoPickerEmpty');
        const selectedPaths = new Set(loadPluginSettings ? (pluginSettings['imageFiles[]'] || []) : []);

        try {
            const response = await fetch('/photo-library/list');
            const result = await response.json();
            const photos = result.photos || [];

            if (photos.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            photos.forEach(photo => {
                const isSelected = selectedPaths.has(photo.path);

                const item = document.createElement('div');
                item.className = 'photo-picker-item' + (isSelected ? ' selected' : '');

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.name = 'imageFiles[]';
                checkbox.value = photo.path;
                checkbox.checked = isSelected;
                item.appendChild(checkbox);

                const img = document.createElement('img');
                img.src = photo.url;
                img.alt = photo.filename;
                item.appendChild(img);

                checkbox.addEventListener('click', event => event.stopPropagation());
                checkbox.addEventListener('change', () => {
                    item.classList.toggle('selected', checkbox.checked);
                });
                item.addEventListener('click', () => {
                    checkbox.checked = !checkbox.checked;
                    checkbox.dispatchEvent(new Event('change'));
                });

                grid.appendChild(item);
            });
        } catch (error) {
            console.error('Error loading photo library:', error);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('backgroundColor').value = (loadPluginSettings && pluginSettings.backgroundColor) || '#ffffff';
        const backgroundOption = (loadPluginSettings && pluginSettings.backgroundOption) || 'blur';
        document.querySelector(`input[name="backgroundOption"][value="${backgroundOption}"]`).checked = true;

        if (loadPluginSettings) {
            document.getElementById('padImage').checked = pluginSettings.padImage == 'false';
            document.getElementById('randomize').checked = pluginSettings.randomize;
        }

        loadPhotoPicker();
    });
</script>
