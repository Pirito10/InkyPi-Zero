{% if connected %}
<div class="form-group">
    <label for="listIdLeft" class="form-label">Lista de tareas (izquierda):</label>
    <select id="listIdLeft" name="listIdLeft" class="form-input">
        {% for list in lists %}
            <option value="{{ list.id }}">{{ list.displayName }}</option>
        {% endfor %}
    </select>
</div>

<div class="form-group">
    <label for="listIdRight" class="form-label">Lista de tareas (derecha, opcional):</label>
    <select id="listIdRight" name="listIdRight" class="form-input">
        <option value="">Ninguna</option>
        {% for list in lists %}
            <option value="{{ list.id }}">{{ list.displayName }}</option>
        {% endfor %}
    </select>
</div>
{% else %}
<div class="form-group">
    <p>No se ha podido conectar con Microsoft To Do. Ejecuta <code>scripts/connect_microsoft_todo.py</code> en el servidor para autorizar la cuenta, y vuelve a abrir estos ajustes.</p>
</div>
{% endif %}

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const listIdLeft = document.getElementById('listIdLeft');
        const listIdRight = document.getElementById('listIdRight');
        if (loadPluginSettings) {
            if (listIdLeft) listIdLeft.value = pluginSettings.listIdLeft;
            if (listIdRight) listIdRight.value = pluginSettings.listIdRight || '';
        }
    });
</script>
