<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ config.name }}</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='styles/main.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='styles/inky.css') }}">
    <script>
        (function() {
            const theme = localStorage.getItem('inkypi-theme') || 
                         (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
        let lastModified = null;
        let currentObjectUrl = null;
        const refreshIntervalMs = 3 * 1000;

        async function refreshImage() {
            const img = document.querySelector('.image-container img');
            if (!img) return;

            try {
                const headers = {};
                if (lastModified) {
                    headers['If-Modified-Since'] = lastModified;
                }

                const response = await fetch('{{ url_for("main.get_current_image") }}', { headers });

                if (response.status === 304) {
                    return;
                }

                if (!response.ok) {
                    console.error('Failed to fetch image:', response.status);
                    return;
                }

                const blob = await response.blob();
                const objectUrl = URL.createObjectURL(blob);

                if (currentObjectUrl) {
                    URL.revokeObjectURL(currentObjectUrl);
                }

                img.src = objectUrl;
                currentObjectUrl = objectUrl;
                lastModified = response.headers.get('Last-Modified');
            } catch (error) {
                console.error('Error refreshing image:', error);
            }
        }

        let refreshIntervalId = null;

        function startPolling() {
            if (refreshIntervalId) return;
            refreshImage();
            refreshIntervalId = setInterval(refreshImage, refreshIntervalMs);
        }

        function stopPolling() {
            clearInterval(refreshIntervalId);
            refreshIntervalId = null;
        }

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                stopPolling();
            } else {
                startPolling();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            if (!document.hidden) {
                startPolling();
            }
        });
    </script>
    <script src="{{ url_for('static', filename='scripts/image_modal.js') }}"></script>
</head>
<body>
    <script src="{{ url_for('static', filename='scripts/dark_mode.js') }}"></script>
    <!-- Subtle frame container -->
    <div class="frame">
        <!-- Page Title -->
        <header class="header">
            <button class="settings-button dark-mode-toggle" title="Cambiar modo oscuro" aria-label="Cambiar modo oscuro">
                <svg class="header-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg>
                <svg class="header-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <h1>{{ config.name }}</h1>
            <div class="header-nav">
                <a href="{{ url_for('photo_library.photo_library_page') }}" class="settings-button" title="Biblioteca de fotos">
                    <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                </a>
                <a href="{{ url_for('playlist.playlists') }}" class="settings-button" title="Listas de reproducción">
                    <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="5" x2="21" y2="5"/><line x1="3" y1="11" x2="10" y2="11"/><line x1="3" y1="15" x2="10" y2="15"/><line x1="3" y1="19" x2="10" y2="19"/><polygon points="13 9 13 21 22 15"/></svg>
                </a>
                <a href="{{ url_for('settings.settings_page') }}" class="settings-button" title="Configuración">
                    <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
                </a>
            </div>
        </header>

        <!-- Display the current image -->
        <div class="image-container">
            <img src="{{ url_for('static', filename='images/current_image.png') }}" alt="Imagen actual">
        </div>

        <!-- Separator -->
        <div class="separator"></div>

        <div class="plugins-header">
            <h2 class="plugins-title">Plugins</h2>
            <div class="plugins-controls">
                <button class="sort-toggle" id="sortToggle" title="Reordenar plugins">Ordenar</button>
                <button class="view-toggle" id="viewToggle" title="Cambiar vista">Lista</button>
            </div>
        </div>

        <div class="sort-hint" id="sortHint">Arrastra los plugins para reordenarlos. Pulsa "Guardar" cuando termines.</div>

        <div class="plugins-container" id="pluginsContainer">
            {% for plugin in plugins %}
            <a href="{{ url_for('plugin.plugin_page', plugin_id=plugin.id) }}"
               class="plugin-item"
               data-plugin-id="{{ plugin.id }}"
               title="{{ plugin.display_name }}"
               draggable="false">
                <img src="{{ url_for('plugin.image', plugin_id=plugin.id, filename='icon.png') }}"
                     alt="{{ plugin.display_name }}"
                     class="icon-image">
                <span class="plugin-name">{{ plugin.display_name }}</span>
            </a>
            {% endfor %}
        </div>

        <script>
            // View mode (grid/list)
            const viewToggle = document.getElementById('viewToggle');
            const pluginsContainer = document.getElementById('pluginsContainer');
            let currentView = localStorage.getItem('inkypi-plugins-view') || 'grid';

            function updateView() {
                if (currentView === 'list') {
                    pluginsContainer.classList.add('list-view');
                    viewToggle.textContent = 'Cuadrícula';
                } else {
                    pluginsContainer.classList.remove('list-view');
                    viewToggle.textContent = 'Lista';
                }
            }

            viewToggle.addEventListener('click', () => {
                currentView = currentView === 'grid' ? 'list' : 'grid';
                localStorage.setItem('inkypi-plugins-view', currentView);
                updateView();
            });

            updateView();

            // Sort mode
            const sortToggle = document.getElementById('sortToggle');
            const sortHint = document.getElementById('sortHint');
            let isSorting = false;
            let draggedItem = null;

            function enableSorting() {
                isSorting = true;
                sortToggle.classList.add('active');
                sortToggle.textContent = 'Guardar';
                sortHint.classList.add('visible');
                pluginsContainer.classList.add('sorting');

                document.querySelectorAll('.plugin-item').forEach(item => {
                    item.draggable = true;
                    item.addEventListener('dragstart', handleDragStart);
                    item.addEventListener('dragend', handleDragEnd);
                    item.addEventListener('dragover', handleDragOver);
                    item.addEventListener('dragleave', handleDragLeave);
                    item.addEventListener('drop', handleDrop);
                    item.addEventListener('click', preventClick);
                });
            }

            function disableSorting() {
                isSorting = false;
                sortToggle.classList.remove('active');
                sortToggle.textContent = 'Ordenar';
                sortHint.classList.remove('visible');
                pluginsContainer.classList.remove('sorting');

                document.querySelectorAll('.plugin-item').forEach(item => {
                    item.draggable = false;
                    item.removeEventListener('dragstart', handleDragStart);
                    item.removeEventListener('dragend', handleDragEnd);
                    item.removeEventListener('dragover', handleDragOver);
                    item.removeEventListener('dragleave', handleDragLeave);
                    item.removeEventListener('drop', handleDrop);
                    item.removeEventListener('click', preventClick);
                });

                // Save order
                savePluginOrder();
            }

            function preventClick(e) {
                if (isSorting) {
                    e.preventDefault();
                }
            }

            function handleDragStart(e) {
                draggedItem = this;
                this.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            }

            function handleDragEnd(e) {
                this.classList.remove('dragging');
                document.querySelectorAll('.plugin-item').forEach(item => {
                    item.classList.remove('drag-over');
                });
            }

            function handleDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                if (this !== draggedItem) {
                    this.classList.add('drag-over');
                }
            }

            function handleDragLeave(e) {
                this.classList.remove('drag-over');
            }

            function handleDrop(e) {
                e.preventDefault();
                this.classList.remove('drag-over');

                if (this !== draggedItem) {
                    const items = Array.from(pluginsContainer.children);
                    const draggedIndex = items.indexOf(draggedItem);
                    const targetIndex = items.indexOf(this);

                    if (draggedIndex < targetIndex) {
                        this.parentNode.insertBefore(draggedItem, this.nextSibling);
                    } else {
                        this.parentNode.insertBefore(draggedItem, this);
                    }
                }
            }

            async function savePluginOrder() {
                const order = Array.from(pluginsContainer.children).map(item => item.dataset.pluginId);
                try {
                    const response = await fetch('{{ url_for("main.save_plugin_order") }}', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ order: order })
                    });
                    if (!response.ok) {
                        console.error('Failed to save plugin order');
                    }
                } catch (error) {
                    console.error('Error saving plugin order:', error);
                }
            }

            sortToggle.addEventListener('click', () => {
                if (isSorting) {
                    disableSorting();
                } else {
                    enableSorting();
                }
            });
        </script>
    </div>
</body>
</html>
