<!-- Refresh Settings Form - Reusable Component. Interactivity (click/focus
     handling, dynamic min interval) is wired up by RefreshSettingsManager;
     every page including this partial must instantiate one for this prefix. -->
<div class="form-group nowrap" id="{{ prefix }}-group-interval">
  <input type="radio" name="refreshType" id="{{ prefix }}-refresh-interval" value="interval" checked>
  <label for="{{ prefix }}-refresh-interval">Cada</label>
  <input type="number" id="{{ prefix }}-interval" name="interval" class="form-input" required min="3" placeholder="Introduce un número">
  <span class="select-wrapper">
    <select id="{{ prefix }}-unit" name="unit" class="form-input" required>
      <option value="minute">minuto(s)</option>
      <option value="hour">hora(s)</option>
      <option value="day">día(s)</option>
    </select>
    <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
  </span>
</div>

<div class="form-group nowrap" id="{{ prefix }}-group-scheduled">
  <input type="radio" name="refreshType" id="{{ prefix }}-refresh-scheduled" value="scheduled">
  <label for="{{ prefix }}-refresh-scheduled">Diariamente a las</label>
  <input id="{{ prefix }}-scheduled" class="time-input" type="time" name="refreshTime" step="900">
</div>
